[package]
name = "destructible-fps-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Technical spike for a server-authoritative, fully destructible multiplayer FPS"
license = "UNLICENSED"
publish = false

[lib]
name = "destructible_fps"
path = "src/lib.rs"

[[bin]]
name = "destruction-benchmark"
path = "src/bin/destruction_benchmark.rs"

[[bin]]
name = "playable-demo"
path = "src/bin/playable_demo.rs"

[[bin]]
name = "multiplayer-demo"
path = "src/bin/multiplayer_demo.rs"

[[bin]]
name = "structural-benchmark"
path = "src/bin/structural_benchmark.rs"

[[bin]]
name = "structural-load-benchmark"
path = "src/bin/structural_load_benchmark.rs"

[[bin]]
name = "physics-benchmark"
path = "src/bin/physics_benchmark.rs"

[[bin]]
name = "construction-benchmark"
path = "src/bin/construction_benchmark.rs"

[[bin]]
name = "character-benchmark"
path = "src/bin/character_benchmark.rs"

[[bin]]
name = "dedicated-server"
path = "src/bin/dedicated_server.rs"

[[bin]]
name = "snapshot-benchmark"
path = "src/bin/snapshot_benchmark.rs"

[[bin]]
name = "secure-dedicated-server"
path = "src/bin/secure_dedicated_server.rs"

[[bin]]
name = "lan-policy-check"
path = "src/bin/lan_policy_check.rs"

[dependencies]
base64 = "=0.22.1"
bytes = "=1.12.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = "=0.33.6"
if-addrs = "=0.14.0"
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["aws_lc_rs"] }
miniz_oxide = "=0.9.1"
pollster = "=1.0.1"
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
x509-parser = { version = "=0.18.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[dev-dependencies]
aws-lc-rs = "=1.17.3"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
