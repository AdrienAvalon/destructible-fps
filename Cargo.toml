[package]
name = "destructible-fps-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Technical spike for a server-authoritative, fully destructible multiplayer FPS"
license = "UNLICENSED"
publish = false

[lib]
name = "destructible_fps"
path = "src/lib.rs"

[[bin]]
name = "destruction-benchmark"
path = "src/bin/destruction_benchmark.rs"

[[bin]]
name = "playable-demo"
path = "src/bin/playable_demo.rs"

[[bin]]
name = "structural-benchmark"
path = "src/bin/structural_benchmark.rs"

[[bin]]
name = "physics-benchmark"
path = "src/bin/physics_benchmark.rs"

[[bin]]
name = "dedicated-server"
path = "src/bin/dedicated_server.rs"

[[bin]]
name = "snapshot-benchmark"
path = "src/bin/snapshot_benchmark.rs"

[dependencies]
bytes = "=1.12.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = "=0.33.6"
pollster = "=1.0.1"
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
